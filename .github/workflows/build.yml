name: build

# Every push builds ezclip.exe on Windows. If Cargo.toml's version has no
# GitHub release yet, the build is published as release v<version> with the
# matching section of CHANGELOG.md as its notes.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ezclip
          path: target/release/ezclip.exe
      - name: Publish release (if this version is new)
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $tag = "v$ver"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "$tag already released"; exit 0 }
          $notes = @(); $in = $false
          foreach ($l in Get-Content CHANGELOG.md) {
            if ($l -match '^## ') { if ($in) { break }; $in = ($l -match "^## $([regex]::Escape($ver))\b"); continue }
            if ($in) { $notes += $l }
          }
          $notes += ""
          $notes += "**Install:** download ``ezclip.exe`` below, put it somewhere permanent (e.g. ``C:\Program Files\ezclip\``) and double-click it."
          $notes -join "`n" | Out-File -Encoding utf8 notes.md
          Copy-Item target/release/ezclip.exe ezclip.exe
          gh release create $tag ezclip.exe --target $env:GITHUB_SHA --title "ezclip $ver" --notes-file notes.md --latest
          exit $LASTEXITCODE
