name: build

# Every push builds and tests shear.exe on Windows. On main, if Cargo.toml's
# version has no GitHub release yet, the build is published as release
# v<version> with the matching section of CHANGELOG.md as its notes.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: shear
          path: target/release/shear.exe
      - name: Publish release (if this version is new)
        # Only main publishes. The work branch is pushed with the same commit,
        # and two runs racing to create the same release would fail one of them.
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $tag = "v$ver"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "$tag already released"; exit 0 }
          $notes = @(); $in = $false
          foreach ($l in Get-Content CHANGELOG.md) {
            if ($l -match '^## ') { if ($in) { break }; $in = ($l -match "^## $([regex]::Escape($ver))\b"); continue }
            if ($in) { $notes += $l }
          }
          $notes += ""
          $notes += "**Install:** download ``shear.exe`` below, put it somewhere permanent (e.g. ``C:\Program Files\Shear\``) and double-click it. Already installed? Use the Update button in the app."
          $notes -join "`n" | Out-File -Encoding utf8 notes.md
          Copy-Item target/release/shear.exe shear.exe
          # Transition from the old name: ezclip v0.5.0's updater downloads "ezclip.exe",
          # so publish the same build under that name too. Remove once nobody runs ezclip.
          Copy-Item target/release/shear.exe ezclip.exe
          gh release create $tag shear.exe ezclip.exe --target $env:GITHUB_SHA --title "Shear $ver" --notes-file notes.md --latest
          if ($LASTEXITCODE -ne 0) {
            # Someone else created it in the meantime: that's fine.
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) { Write-Host "$tag was created by another run"; exit 0 }
            exit 1
          }
